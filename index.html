<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCS 會展節點控管系統</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <!-- ======== 樣式 ======== -->
  <style>
    /* ---- CSS Variables ---- */
    :root {
      --primary:       #0d2137;
      --primary-mid:   #163352;
      --primary-light: #1e4976;
      --accent:        #00b4d8;
      --accent-light:  #90e0ef;
      --success:       #2ec4b6;
      --warning:       #ff9f1c;
      --danger:        #e63946;
      --danger-dark:   #9b1e26;
      --neutral-100:   #f4f6f9;
      --neutral-200:   #e8ecf1;
      --neutral-300:   #cdd5de;
      --neutral-500:   #8896a7;
      --neutral-700:   #3d4f61;
      --neutral-900:   #1a2535;
      --sidebar-w:     240px;
      --topbar-h:      56px;
      --font-main:     'Noto Sans TC', sans-serif;
      --font-mono:     'IBM Plex Mono', monospace;
      --radius:        8px;
      --shadow-sm:     0 1px 3px rgba(0,0,0,.12);
      --shadow-md:     0 4px 12px rgba(0,0,0,.15);
      --shadow-lg:     0 8px 24px rgba(0,0,0,.2);
      --transition:    .2s ease;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      background: var(--neutral-100);
      color: var(--neutral-900);
      margin: 0;
      overflow-x: hidden;
    }

    /* ===== LAYOUT ===== */
    #app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--primary);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
      transition: transform var(--transition);
    }

    .sidebar-brand {
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--primary);
    }

    .brand-text {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-sub {
      color: var(--accent-light);
      font-size: 10px;
      font-weight: 400;
      font-family: var(--font-mono);
      letter-spacing: 1px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 0;
      overflow-y: auto;
    }

    .nav-section {
      padding: 8px 16px 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--neutral-500);
      text-transform: uppercase;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: 13.5px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all var(--transition);
    }

    .nav-item:hover {
      color: #fff;
      background: rgba(255,255,255,.06);
    }

    .nav-item.active {
      color: var(--accent);
      background: rgba(0,180,216,.1);
      border-left-color: var(--accent);
    }

    .nav-item i { font-size: 16px; width: 20px; text-align: center; }

    .sidebar-user {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }

    .user-info { flex: 1; }
    .user-name { color: #fff; font-size: 13px; font-weight: 500; }
    .user-role { color: var(--neutral-500); font-size: 11px; }

    .btn-logout {
      background: none;
      border: none;
      color: var(--neutral-500);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: color var(--transition);
    }
    .btn-logout:hover { color: var(--danger); }

    /* ===== MAIN CONTENT ===== */
    #main-content {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ===== TOPBAR ===== */
    #topbar {
      height: var(--topbar-h);
      background: #fff;
      border-bottom: 1px solid var(--neutral-200);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }

    .topbar-meta {
      font-size: 12px;
      color: var(--neutral-500);
    }

    /* ===== PAGE CONTENT ===== */
    #page-content {
      padding: 24px;
      flex: 1;
    }

    /* ===== LOGIN SCREEN ===== */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      position: fixed; inset: 0; z-index: 999;
    }

    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 380px;
      box-shadow: var(--shadow-lg);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo-icon {
      width: 56px; height: 56px;
      background: var(--accent);
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px; color: var(--primary);
      margin-bottom: 12px;
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .login-subtitle {
      font-size: 12px;
      color: var(--neutral-500);
      font-family: var(--font-mono);
      letter-spacing: 1px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--neutral-700);
    }

    .form-control {
      border: 1.5px solid var(--neutral-200);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      font-family: var(--font-main);
      transition: border-color var(--transition);
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,180,216,.15);
    }

    /* ===== CARDS ===== */
    .card {
      background: #fff;
      border: 1px solid var(--neutral-200);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--neutral-200);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
    }

    .card-body { padding: 20px; }

    /* ===== STAT CARDS ===== */
    .stat-card {
      background: #fff;
      border: 1px solid var(--neutral-200);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .stat-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }

    .stat-icon.blue   { background: rgba(0,180,216,.12); color: var(--accent); }
    .stat-icon.green  { background: rgba(46,196,182,.12); color: var(--success); }
    .stat-icon.orange { background: rgba(255,159,28,.12); color: var(--warning); }
    .stat-icon.red    { background: rgba(230,57,70,.12); color: var(--danger); }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      color: var(--primary);
      font-family: var(--font-mono);
    }

    .stat-label {
      font-size: 12px;
      color: var(--neutral-500);
      margin-top: 4px;
    }

    /* ===== PROJECT CARDS ===== */
    .project-card {
      background: #fff;
      border: 1px solid var(--neutral-200);
      border-radius: var(--radius);
      padding: 18px 20px;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .project-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .project-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--success);
    }

    .project-card.status-warning::before { background: var(--warning); }
    .project-card.status-danger::before  { background: var(--danger); }
    .project-card.status-critical::before { background: var(--danger-dark); }

    .project-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    .project-meta {
      font-size: 12px;
      color: var(--neutral-500);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .project-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .progress-bar-custom {
      height: 6px;
      background: var(--neutral-200);
      border-radius: 99px;
      overflow: hidden;
      margin: 10px 0;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--success);
      transition: width .5s ease;
    }

    /* ===== STATUS BADGES ===== */
    .badge-status {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 600;
    }

    .badge-normal   { background: rgba(46,196,182,.15); color: var(--success); }
    .badge-warning  { background: rgba(255,159,28,.15); color: var(--warning); }
    .badge-danger   { background: rgba(230,57,70,.15); color: var(--danger); }
    .badge-blocked  { background: rgba(155,30,38,.15); color: var(--danger-dark); }
    .badge-done     { background: rgba(46,196,182,.1); color: var(--success); }
    .badge-progress { background: rgba(0,180,216,.1); color: var(--accent); }
    .badge-pending  { background: rgba(136,150,167,.1); color: var(--neutral-500); }

    /* ===== DELAY LEVEL BADGES ===== */
    .delay-l0 { background: #e8f5e9; color: #2e7d32; }
    .delay-l1 { background: #fff8e1; color: #f57f17; }
    .delay-l2 { background: #fff3e0; color: #e65100; }
    .delay-l3 { background: #fce4ec; color: #b71c1c; }
    .delay-l4 { background: #3d0000; color: #ff8a80; }

    /* ===== MILESTONES TABLE ===== */
    .milestone-row {
      display: grid;
      grid-template-columns: 1fr 120px 100px 80px 80px 140px;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--neutral-200);
      font-size: 13px;
      transition: background var(--transition);
    }

    .milestone-row:hover { background: var(--neutral-100); }

    .milestone-row.header {
      background: var(--neutral-100);
      font-weight: 600;
      font-size: 11px;
      color: var(--neutral-500);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .milestone-critical { color: var(--danger); font-size: 10px; }

    /* ===== BUTTONS ===== */
    .btn-primary-custom {
      background: var(--accent);
      color: var(--primary);
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn-primary-custom:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    .btn-sm-icon {
      width: 30px; height: 30px;
      border: 1px solid var(--neutral-200);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px;
      color: var(--neutral-700);
      transition: all var(--transition);
    }

    .btn-sm-icon:hover { background: var(--neutral-100); border-color: var(--neutral-300); }
    .btn-sm-icon.danger:hover { background: rgba(230,57,70,.1); border-color: var(--danger); color: var(--danger); }

    /* ===== DELAY IMPACT PANEL ===== */
    .impact-panel {
      background: #fff;
      border: 2px solid var(--danger);
      border-radius: var(--radius);
      padding: 20px;
    }

    .impact-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .impact-level-badge {
      padding: 4px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .recommendation-item {
      padding: 8px 12px;
      background: var(--neutral-100);
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 6px;
    }

    /* ===== RESOURCES ===== */
    .resource-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .resource-unconfirmed { background: #f3f4f6; color: #6b7280; }
    .resource-pending     { background: #fef3c7; color: #92400e; }
    .resource-confirmed   { background: #d1fae5; color: #065f46; }
    .resource-expired     { background: #fee2e2; color: #991b1b; }

    /* ===== MODALS ===== */
    .modal-content {
      border-radius: var(--radius);
      border: none;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      background: var(--primary);
      color: #fff;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 16px 20px;
    }

    .modal-header .btn-close { filter: invert(1); }
    .modal-title { font-size: 15px; font-weight: 700; }

    /* ===== LOADING ===== */
    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(13,33,55,.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }

    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== ALERTS ===== */
    .alert-toast {
      position: fixed;
      top: 70px; right: 20px;
      z-index: 9999;
      min-width: 280px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      animation: slideInRight .3s ease;
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ===== UTILITIES ===== */
    .text-accent  { color: var(--accent); }
    .text-danger  { color: var(--danger); }
    .text-warning { color: var(--warning); }
    .text-success { color: var(--success); }
    .text-muted   { color: var(--neutral-500); }
    .font-mono    { font-family: var(--font-mono); }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--neutral-500);
    }

    .empty-state i { font-size: 48px; margin-bottom: 12px; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #main-content { margin-left: 0; }
    }
  </style>
</head>
<body>

<!-- ======== LOGIN SCREEN ======== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">📊</div>
      <div class="login-title">MCS 節點控管系統</div>
      <div class="login-subtitle">MILESTONE CONTROL SYSTEM</div>
    </div>
    <div class="mb-3">
      <label class="form-label">帳號</label>
      <input type="text" id="input-username" class="form-control" placeholder="請輸入帳號" />
    </div>
    <div class="mb-4">
      <label class="form-label">密碼</label>
      <input type="password" id="input-password" class="form-control" placeholder="請輸入密碼"
             onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <button class="btn-primary-custom w-100" onclick="doLogin()">
      <i class="bi bi-box-arrow-in-right me-2"></i>登入系統
    </button>
    <div id="login-error" class="text-danger text-center mt-3 small" style="display:none"></div>
    <div class="text-center mt-3 text-muted" style="font-size:12px">
      測試帳號：admin / Admin@2024
    </div>
  </div>
</div>

<!-- ======== APP SHELL ======== -->
<div id="app-shell" style="display:none">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <div class="brand-icon">📊</div>
        <div>
          <div class="brand-text">MCS System</div>
          <div class="brand-sub">MILESTONE CONTROL</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">主要功能</div>
      <a class="nav-item active" onclick="navigate('dashboard')">
        <i class="bi bi-grid-1x2-fill"></i>Dashboard
      </a>
      <a class="nav-item" onclick="navigate('projects')">
        <i class="bi bi-folder2-open"></i>專案管理
      </a>
      <a class="nav-item" onclick="navigate('resources')">
        <i class="bi bi-box-seam"></i>資源控管
      </a>

      <div class="nav-section" style="margin-top:8px">工具</div>
      <a class="nav-item" onclick="navigate('delay-simulator')">
        <i class="bi bi-exclamation-triangle-fill"></i>延遲模擬
      </a>
      <a class="nav-item" id="nav-admin" onclick="navigate('admin')" style="display:none">
        <i class="bi bi-gear-fill"></i>系統管理
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="sidebar-name">-</div>
        <div class="user-role" id="sidebar-role">-</div>
      </div>
      <button class="btn-logout" onclick="doLogout()" title="登出">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div id="main-content">
    <div id="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-meta" id="topbar-meta"></div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="topbar-datetime" class="font-mono text-muted" style="font-size:12px"></span>
        <button class="btn-sm-icon" onclick="refreshCurrentPage()" title="重新整理">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>

    <div id="page-content">
      <!-- 頁面內容由 JS 動態渲染 -->
    </div>
  </div>
</div>

<!-- ======== MODALS ======== -->

<!-- 新增專案 Modal -->
<div class="modal fade" id="modal-create-project" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>新增專案</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">專案名稱 *</label>
            <input type="text" id="f-proj-name" class="form-control" placeholder="例：2026 AI國際研討會" />
          </div>
          <div class="col-md-6">
            <label class="form-label">客戶名稱 *</label>
            <input type="text" id="f-proj-client" class="form-control" placeholder="例：科技部" />
          </div>
          <div class="col-md-6">
            <label class="form-label">活動類型 *</label>
            <select id="f-proj-type" class="form-control">
              <option value="">請選擇</option>
              <option value="國際研討會">國際研討會</option>
              <option value="記者會">記者會</option>
              <option value="體驗活動">體驗活動</option>
              <option value="跨島大型活動">跨島大型活動</option>
              <option value="一般會議">一般會議</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">活動日期</label>
            <input type="date" id="f-proj-date" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">活動地點</label>
            <input type="text" id="f-proj-location" class="form-control" placeholder="例：台北國際會議中心" />
          </div>

<script>
// ============================================================
// 設定：替換成您的 Google Apps Script 部署 URL

const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzqAMaCRznNY_Wl18w9l0ZrM_SNaM_JnH45N753nY7VJ1joj6dH0Scps1yQt_j0xVg/exec';

// ============================================================
// 全域狀態
// ============================================================
const APP = {
  token:          null,
  user:           null,
  currentPage:    'dashboard',
  currentProject: null,
  dashboardData:  null
};

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  // 更新時鐘
  setInterval(() => {
    const now = new Date();
    const el = document.getElementById('topbar-datetime');
    if (el) el.textContent = now.toLocaleString('zh-TW', { hour12: false });
  }, 1000);

  // 嘗試從 localStorage 恢復登入狀態
  const savedToken = localStorage.getItem('mcs_token');
  const savedUser  = localStorage.getItem('mcs_user');
  if (savedToken && savedUser) {
    APP.token = savedToken;
    APP.user  = JSON.parse(savedUser);
    showApp();
    loadDashboard();
  }
});

// ============================================================
// 認證
// ============================================================
async function doLogin() {
  const username = document.getElementById('input-username').value.trim();
  const password = document.getElementById('input-password').value.trim();

  if (!username || !password) {
    showLoginError('請輸入帳號與密碼');
    return;
  }

  showLoading(true);

  try {
    const res = await apiPost({ action: 'login', username, password });
    if (res.success) {
      APP.token = res.token;
      APP.user  = res.user;
      localStorage.setItem('mcs_token', res.token);
      localStorage.setItem('mcs_user', JSON.stringify(res.user));
      showApp();
      loadDashboard();
    } else {
      showLoginError(res.error);
    }
  } catch (e) {
    showLoginError('連線失敗，請確認 API 設定：' + e.message);
  } finally {
    showLoading(false);
  }
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';

  // 更新 sidebar 使用者資訊
  document.getElementById('sidebar-name').textContent  = APP.user.displayName;
  document.getElementById('sidebar-role').textContent  = APP.user.role;
  document.getElementById('sidebar-avatar').textContent = APP.user.displayName.charAt(0);

  // Admin 顯示管理選單
  if (APP.user.role === 'Admin') {
    document.getElementById('nav-admin').style.display = 'flex';
  }
}

function doLogout() {
  APP.token = null;
  APP.user  = null;
  localStorage.removeItem('mcs_token');
  localStorage.removeItem('mcs_user');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-shell').style.display = 'none';
}

// ============================================================
// 路由 / 頁面導航
// ============================================================
function navigate(page, param) {
  APP.currentPage = page;

  // 更新 sidebar active 狀態
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const pageNavMap = {
    dashboard: 0, projects: 1, resources: 2, 'delay-simulator': 3, admin: 4
  };

  const navItems = document.querySelectorAll('.nav-item');
  const idx = pageNavMap[page];
  if (idx !== undefined && navItems[idx]) navItems[idx].classList.add('active');

  switch (page) {
    case 'dashboard':       loadDashboard(); break;
    case 'projects':        loadProjects(); break;
    case 'project-detail':  loadProjectDetail(param); break;
    case 'resources':       loadResources(param); break;
    case 'delay-simulator': loadDelaySimulator(param); break;
    case 'admin':           loadAdmin(); break;
  }
}

function refreshCurrentPage() {
  navigate(APP.currentPage, APP.currentProject);
}

// ============================================================
// DASHBOARD 頁
// ============================================================
async function loadDashboard() {
  setTopbar('Dashboard', 'imPR 會展節點控管系統');
  showLoading(true);

  try {
    const res = await apiGet({ action: 'getDashboardData', token: APP.token });
    if (!res.success) { handleApiError(res); return; }

    APP.dashboardData = res;
    renderDashboard(res);
  } catch (e) {
    showToast('danger', '載入失敗：' + e.message);
  } finally {
    showLoading(false);
  }
}

function renderDashboard(data) {
  const { summary, projects, upcomingResources, overdueResources } = data;

  const statusColor = s => {
    if (s === '卡關') return 'danger';
    if (s === '延遲') return 'danger';
    if (s === '注意') return 'warning';
    return 'success';
  };

  const badgeClass = s => {
    if (s === '卡關') return 'badge-blocked';
    if (s === '延遲') return 'badge-danger';
    if (s === '注意') return 'badge-warning';
    return 'badge-normal';
  };

  document.getElementById('page-content').innerHTML = `
    <!-- Summary Stats -->
    <div class="row g-3 mb-4">
      ${[
        { icon:'bi-folder2-open', color:'blue',   value: summary.totalProjects,          label:'總專案數' },
        { icon:'bi-play-circle',  color:'green',  value: summary.activeProjects,         label:'進行中專案' },
        { icon:'bi-exclamation-triangle', color:'orange', value: summary.delayedProjects, label:'延遲專案' },
        { icon:'bi-alarm',        color:'red',    value: summary.criticalMilestoneDelays, label:'關鍵節點延遲' },
      ].map(s => `
        <div class="col-xl-3 col-md-6">
          <div class="stat-card">
            <div class="stat-icon ${s.color}"><i class="bi ${s.icon}"></i></div>
            <div>
              <div class="stat-value">${s.value}</div>
              <div class="stat-label">${s.label}</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="row g-3">
      <!-- Project Cards -->
      <div class="col-xl-8">
        <div class="card">
          <div class="card-header">
            <span><i class="bi bi-kanban me-2"></i>專案總覽</span>
            ${canEdit() ? `<button class="btn-primary-custom" style="font-size:13px;padding:6px 14px" onclick="openCreateProject()">
              <i class="bi bi-plus me-1"></i>新增專案
            </button>` : ''}
          </div>
          <div class="card-body p-0">
            ${projects.length === 0 ? `<div class="empty-state"><i class="bi bi-folder2"></i><p>尚無專案</p></div>` :
              projects.map(p => `
                <div class="project-card status-${p.status === '注意' ? 'warning' : p.status === '延遲' || p.status === '卡關' ? 'danger' : 'normal'} m-3"
                     onclick="navigate('project-detail', '${p.projectId}')">
                  <div class="d-flex justify-content-between align-items-start">
                    <div>
                      <div class="project-name">${p.projectName}</div>
                      <div class="project-meta">
                        <span><i class="bi bi-person"></i>${p.clientName}</span>
                        <span><i class="bi bi-calendar3"></i>${formatDate(p.eventDate) || '日期待定'}</span>
                        <span><i class="bi bi-people"></i>${p.pmName || '-'}</span>
                        <span class="badge" style="font-size:10px;background:rgba(0,0,0,.07);color:#555">${p.eventType}</span>
                      </div>
                    </div>
                    <span class="badge-status ${badgeClass(p.status)}">${p.status}</span>
                  </div>
                  <div class="progress-bar-custom">
                    <div class="progress-fill" style="width:${p.progress}%;background:${p.progress < 30 ? 'var(--danger)' : p.progress < 70 ? 'var(--warning)' : 'var(--success)'}"></div>
                  </div>
                  <div class="d-flex justify-content-between" style="font-size:12px;color:var(--neutral-500)">
                    <span>${p.completedMilestones}/${p.totalMilestones} 節點完成</span>
                    <span class="font-mono">${p.progress}%</span>
                    ${p.delayedCount > 0 ? `<span class="text-danger"><i class="bi bi-exclamation-circle me-1"></i>${p.delayedCount} 個延遲</span>` : ''}
                  </div>
                </div>
              `).join('')}
          </div>
        </div>
      </div>

      <!-- Right Column: Resources & Alerts -->
      <div class="col-xl-4">
        <!-- Upcoming Resources -->
        <div class="card mb-3">
          <div class="card-header">
            <span class="text-warning"><i class="bi bi-clock-history me-2"></i>7日內到期資源</span>
            <span class="badge-status badge-warning">${upcomingResources.length}</span>
          </div>
          <div class="card-body p-0">
            ${upcomingResources.length === 0
              ? '<div class="p-3 text-center text-muted" style="font-size:13px">無即將到期資源 ✓</div>'
              : upcomingResources.slice(0, 5).map(r => `
                  <div class="d-flex justify-content-between align-items-center p-3 border-bottom" style="font-size:13px">
                    <div>
                      <div class="fw-600">${r.resourceName}</div>
                      <div class="text-muted" style="font-size:11px">${r.type} · 截止 ${formatDate(r.cutoffDate)}</div>
                    </div>
                    <span class="resource-badge resource-pending">${r.status}</span>
                  </div>`).join('')}
          </div>
        </div>

        <!-- Overdue Resources -->
        ${overdueResources.length > 0 ? `
        <div class="card">
          <div class="card-header" style="border-left:3px solid var(--danger)">
            <span class="text-danger"><i class="bi bi-exclamation-octagon me-2"></i>已逾期未確認資源</span>
            <span class="badge-status badge-danger">${overdueResources.length}</span>
          </div>
          <div class="card-body p-0">
            ${overdueResources.slice(0, 5).map(r => `
              <div class="d-flex justify-content-between align-items-center p-3 border-bottom" style="font-size:13px">
                <div>
                  <div class="fw-600 text-danger">${r.resourceName}</div>
                  <div class="text-muted" style="font-size:11px">${r.type} · 已逾 ${formatDate(r.cutoffDate)}</div>
                </div>
                <span class="resource-badge resource-expired">逾期</span>
              </div>`).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>
  `;
}

// ============================================================
// 專案詳細頁
// ============================================================
async function loadProjectDetail(projectId) {
  APP.currentProject = projectId;
  setTopbar('專案詳細', '節點狀態 / 延遲分析 / 資源');
  showLoading(true);

  try {
    const res = await apiGet({ action: 'getProjectDetail', token: APP.token, projectId });
    if (!res.success) { handleApiError(res); return; }
    renderProjectDetail(res);
  } finally {
    showLoading(false);
  }
}

function renderProjectDetail(data) {
  const { project, milestones, resources } = data;

  const statusBadge = s => {
    const map = {
      '未開始':'badge-pending','進行中':'badge-progress','已完成':'badge-done',
      '延遲':'badge-danger','卡關':'badge-blocked'
    };
    return `<span class="badge-status ${map[s] || ''}">${s}</span>`;
  };

  const delayBadge = (days, level) => {
    if (level === 0) return '<span class="text-success font-mono" style="font-size:11px">正常</span>';
    const cls = ['','delay-l1','delay-l2','delay-l3','delay-l4'][level];
    return `<span class="badge-status ${cls} font-mono" style="font-size:11px">+${days}天</span>`;
  };

  const total = milestones.length;

async function loadDelaySimulator(milestoneId) {
  setTopbar('延遲影響模擬', '關鍵節點延遲連鎖分析');

  if (!milestoneId) {
    document.getElementById('page-content').innerHTML = `
      <div class="empty-state">
        <i class="bi bi-exclamation-triangle" style="color:var(--warning)"></i>
        <p>請從專案詳細頁選取延遲節點進行分析</p>
        <button class="btn-primary-custom mt-2" onclick="navigate('projects')">前往專案</button>
      </div>`;
    return;
  }

  showLoading(true);
  try {
    const res = await apiGet({ action: 'calculateDelayImpact', token: APP.token, milestoneId });
    if (!res.success) { handleApiError(res); return; }
    renderDelayImpact(res);
  } finally {
    showLoading(false);
  }
}

function renderDelayImpact(data) {
  const levelColor = ['#e8f5e9','#fff8e1','#fff3e0','#fce4ec','#3d0000'];
  const levelText  = ['正常','輕微','中度','嚴重','危急'];

  document.getElementById('page-content').innerHTML = `
    <div class="impact-panel" style="border-color:${data.delayLevel >= 3 ? 'var(--danger-dark)' : 'var(--warning)'}">
      <div class="impact-header">
        <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size:24px"></i>
        <div>
          <div style="font-size:16px;font-weight:700">${data.milestoneName}</div>
          <div class="text-muted" style="font-size:12px">計畫日期：${formatDate(data.plannedDate)}</div>
        </div>
        ${data.isCritical === 'TRUE' ? '<span class="badge bg-danger ms-auto">🔴 關鍵節點</span>' : ''}
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-3">
          <div class="text-muted" style="font-size:12px">延遲天數</div>
          <div style="font-size:28px;font-weight:800;font-family:var(--font-mono);color:var(--danger)">+${data.delayDays}</div>
        </div>
        <div class="col-md-4">
          <div class="text-muted" style="font-size:12px">延遲等級</div>
          <div class="impact-level-badge mt-1" style="background:${levelColor[data.delayLevel]};color:var(--danger);display:inline-block">
            Level ${data.delayLevel}：${levelText[data.delayLevel]}
          </div>
          <div style="font-size:12px;color:var(--neutral-500);margin-top:4px">${data.delayLevelText}</div>
        </div>
        <div class="col-md-5">
          <div class="text-muted" style="font-size:12px">受影響節點</div>
          <div style="font-size:20px;font-weight:700;color:var(--warning)">${data.affectedCount} 個節點</div>
          ${data.criticalAffectedCount > 0
            ? `<div class="text-danger" style="font-size:12px">⚠ 含 ${data.criticalAffectedCount} 個關鍵節點</div>`
            : ''}
        </div>
      </div>

      <!-- 受影響節點列表 -->
      ${data.affectedMilestones.length > 0 ? `
        <div class="mb-3">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px">受影響節點列表：</div>
          <div class="table-responsive">
            <table class="table table-sm" style="font-size:12px">
              <thead><tr>
                <th>節點名稱</th><th>原計畫日</th><th>預估新日期</th><th>是否關鍵</th><th>目前狀態</th>
              </tr></thead>
              <tbody>
                ${data.affectedMilestones.map(m => `
                  <tr class="${m.isCritical === 'TRUE' ? 'table-danger' : ''}">
                    <td>${m.milestoneName}</td>
                    <td class="font-mono">${formatDate(m.plannedDate)}</td>
                    <td class="font-mono text-danger">${m.estimatedNewDate}</td>
                    <td>${m.isCritical === 'TRUE' ? '🔴' : '-'}</td>
                    <td>${m.status}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      ` : ''}

      <!-- 建議行動 -->
      <div>
        <div style="font-size:13px;font-weight:700;margin-bottom:8px">建議處理行動：</div>
        ${data.recommendations.map(r => `<div class="recommendation-item">${r}</div>`).join('')}
      </div>
    </div>
  `;
}

function openMilestoneModal(milestoneId, projectId, existing) {
  document.getElementById('modal-milestone-title').textContent = milestoneId ? '編輯節點' : '新增節點';
  document.getElementById('f-ms-id').value = milestoneId || '';
  document.getElementById('f-ms-project-id').value = projectId;

  if (existing) {
    document.getElementById('f-ms-name').value        = existing.milestoneName || '';
    document.getElementById('f-ms-planned').value     = existing.plannedDate || '';
    document.getElementById('f-ms-actual').value      = existing.actualDate || '';
    document.getElementById('f-ms-status').value      = existing.status || '未開始';
    document.getElementById('f-ms-role').value        = existing.assignedRole || 'PM';
    document.getElementById('f-ms-critical').checked  = existing.isCritical === 'TRUE' || existing.isCritical === true;
    document.getElementById('f-ms-delay-reason').value = existing.delayReason || '';
    document.getElementById('f-ms-affected').value    = existing.affectedMilestones || '';
    document.getElementById('f-ms-notes').value       = existing.notes || '';
  } else {
    ['f-ms-name','f-ms-planned','f-ms-actual','f-ms-delay-reason','f-ms-affected','f-ms-notes']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-ms-status').value = '未開始';
    document.getElementById('f-ms-critical').checked = false;
  }

  new bootstrap.Modal(document.getElementById('modal-milestone')).show();
}

async function submitMilestone() {
  const milestoneId = document.getElementById('f-ms-id').value;
  const projectId   = document.getElementById('f-ms-project-id').value;
  const name        = document.getElementById('f-ms-name').value.trim();

  if (!name) { showToast('warning', '請填寫節點名稱'); return; }

  const data = {
    milestoneName:      name,
    plannedDate:        document.getElementById('f-ms-planned').value,
    actualDate:         document.getElementById('f-ms-actual').value,
    status:             document.getElementById('f-ms-status').value,
    assignedRole:       document.getElementById('f-ms-role').value,
    isCritical:         document.getElementById('f-ms-critical').checked ? 'TRUE' : 'FALSE',
    delayReason:        document.getElementById('f-ms-delay-reason').value,
    affectedMilestones: document.getElementById('f-ms-affected').value,
    notes:              document.getElementById('f-ms-notes').value
  };

  showLoading(true);
  try {
    let res;
    if (milestoneId) {
      res = await apiPost({ action: 'updateMilestone', token: APP.token, milestoneId, data });
    } else {
      res = await apiPost({ action: 'addMilestone', token: APP.token, projectId, data });
    }

    if (res.success) {
      bootstrap.Modal.getInstance(document.getElementById('modal-milestone')).hide();
      showToast('success', '節點已儲存');

      if (res.delayImpact) {
        // 若有延遲影響，自動跳轉模擬頁
        setTimeout(() => navigate('delay-simulator', milestoneId), 800);
      } else {
        loadProjectDetail(projectId);
      }
    } else {
      showToast('danger', res.error);
    }
  } finally {
    showLoading(false);
  }
}

  if (!confirm('確定要刪除此節點？此操作無法復原。')) return;

  showLoading(true);
  try {
    const res = await apiPost({ action: 'deleteMilestone', token: APP.token, milestoneId });

      loadProjectDetail(APP.currentProject);

// ============================================================
// API 呼叫工具
// ============================================================

async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${GAS_API_URL}?${qs}`, { method: 'GET' });
  return res.json();
}

async function apiPost(body) {
  const res = await fetch(GAS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' }, // GAS 不接受 application/json 的 preflight
    body: JSON.stringify(body)
  });
  return res.json();
}

// ============================================================
// UI 工具
// ============================================================

function setTopbar(title, meta) {
  document.getElementById('topbar-title').textContent = title;
  document.getElementById('topbar-meta').textContent = meta || '';
}

function showLoading(show) {
  let el = document.getElementById('loading-overlay');
  if (show && !el) {
    el = document.createElement('div');
    el.id = 'loading-overlay';
    el.className = 'loading-overlay';
    el.innerHTML = '<div class="loading-spinner"></div>';
    document.body.appendChild(el);
  } else if (!show && el) {
    el.remove();
  }
}

function showToast(type, message) {
  const existing = document.querySelector('.alert-toast');
  if (existing) existing.remove();

  const colorMap = { success: 'success', danger: 'danger', warning: 'warning', info: 'info' };
  const iconMap  = { success: 'check-circle-fill', danger: 'x-circle-fill', warning: 'exclamation-triangle-fill', info: 'info-circle-fill' };

  const el = document.createElement('div');
  el.className = `alert alert-${colorMap[type]} alert-dismissible alert-toast`;
  el.innerHTML = `
    <i class="bi bi-${iconMap[type]} me-2"></i>${message}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  `;
  document.body.appendChild(el);

  setTimeout(() => el.remove(), 4000);
}

function handleApiError(res) {
  if (res.error && res.error.includes('登入')) {
    doLogout();
  }
  showToast('danger', res.error || '發生未知錯誤');
}

function canEdit() {
  return APP.user && ['Admin', 'PM'].includes(APP.user.role);
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
  } catch { return dateStr; }
}
