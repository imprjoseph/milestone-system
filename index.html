<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>imPR MCS 節點控管系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --impr-orange: #E8610A;
      --accent:      #E8610A;
      --accent-lt:   #f08040;
      --accent-pale: rgba(232,97,10,.1);
      --success:     #2ec4b6;
      --warning:     #ffb703;
      --danger:      #e63946;
      --danger-dk:   #9b1e26;
      --n100: #f7f7f7; --n200: #ebebeb; --n300: #d0d0d0;
      --n500: #888; --n700: #444; --n900: #1a1a1a;
      --sidebar-w: 250px; --topbar-h: 56px;
      --font: "Noto Sans TC", sans-serif;
      --mono: "IBM Plex Mono", monospace;
      --r: 8px;
      --sh: 0 1px 3px rgba(0,0,0,.1);
      --shm: 0 4px 12px rgba(0,0,0,.12);
      --shl: 0 8px 28px rgba(0,0,0,.18);
      --tr: .18s ease;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--n100);color:var(--n900);overflow-x:hidden}
    #app-shell{display:flex;min-height:100vh}

    /* SIDEBAR */
    #sidebar{width:var(--sidebar-w);min-height:100vh;background:#111;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;border-right:1px solid rgba(232,97,10,.2)}
    .sb-brand{padding:0;border-bottom:1px solid rgba(232,97,10,.2);background:#000}
    .sb-logo{width:100%;height:64px;object-fit:contain;object-position:left center;padding:10px 14px}
    .sb-nav{flex:1;padding:12px 0;overflow-y:auto}
    .nav-sec{padding:10px 18px 4px;font-size:9px;font-weight:700;letter-spacing:2px;color:#555;text-transform:uppercase}
    .nav-a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.55);cursor:pointer;border-left:3px solid transparent;transition:all var(--tr);font-size:13.5px}
    .nav-a:hover{color:#fff;background:rgba(232,97,10,.08)}
    .nav-a.act{color:var(--accent);background:rgba(232,97,10,.12);border-left-color:var(--accent)}
    .nav-a i{font-size:16px;width:20px;text-align:center}
    .sb-user{padding:14px 18px;border-top:1px solid rgba(232,97,10,.2);display:flex;align-items:center;gap:10px;background:rgba(232,97,10,.05)}
    .u-ava{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
    .u-name{color:#fff;font-size:13px;font-weight:500}
    .u-role{color:var(--accent);font-size:10px;letter-spacing:.5px}
    .btn-out{background:none;border:none;color:#555;cursor:pointer;font-size:16px;transition:color var(--tr)}
    .btn-out:hover{color:var(--danger)}

    /* MAIN */
    #main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column}
    #topbar{height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--n200);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
    .top-title{font-size:16px;font-weight:700;color:var(--n900)}
    .top-meta{font-size:11px;color:var(--n500);margin-top:1px}
    #page{padding:24px;flex:1}

    /* LOGIN */
    #login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#000;position:fixed;inset:0;z-index:999}
    .lg-bg{position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(232,97,10,.03) 40px,rgba(232,97,10,.03) 80px)}
    .lg-box{background:#1a1a1a;border:1px solid rgba(232,97,10,.3);border-radius:16px;padding:40px 36px;width:400px;box-shadow:0 0 60px rgba(232,97,10,.15),var(--shl);position:relative;z-index:1}
    .lg-logo{background:#000;border-radius:10px;padding:14px 20px;margin-bottom:22px;text-align:center;border:1px solid rgba(232,97,10,.2)}
    .lg-logo img{height:46px;object-fit:contain}
    .lg-sys{color:var(--accent);font-size:10px;font-family:var(--mono);letter-spacing:3px;text-align:center;margin-bottom:22px}
    .lg-lbl{font-size:11px;font-weight:600;color:#aaa;margin-bottom:5px}
    .lg-inp{width:100%;background:#111;border:1.5px solid #333;border-radius:var(--r);padding:11px 14px;font-size:14px;color:#fff;font-family:var(--font);outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
    .lg-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,97,10,.15)}
    .btn-lg{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all var(--tr);letter-spacing:.5px}
    .btn-lg:hover{background:var(--accent-lt);transform:translateY(-1px);box-shadow:0 4px 16px rgba(232,97,10,.4)}
    .lg-hint{color:#555;font-size:10px;text-align:center;margin-top:14px;font-family:var(--mono)}

    /* CARDS */
    .card{background:#fff;border:1px solid var(--n200);border-radius:var(--r);box-shadow:var(--sh)}
    .card-hdr{padding:14px 20px;border-bottom:1px solid var(--n200);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--r) var(--r) 0 0}

    /* STAT */
    .stat{background:#fff;border:1px solid var(--n200);border-radius:var(--r);padding:20px;display:flex;align-items:flex-start;gap:16px;box-shadow:var(--sh);transition:transform var(--tr),box-shadow var(--tr)}
    .stat:hover{transform:translateY(-2px);box-shadow:var(--shm)}
    .stat-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
    .ic-or{background:rgba(232,97,10,.1);color:var(--accent)}
    .ic-gr{background:rgba(46,196,182,.1);color:var(--success)}
    .ic-ye{background:rgba(255,183,3,.1);color:var(--warning)}
    .ic-re{background:rgba(230,57,70,.1);color:var(--danger)}
    .stat-v{font-size:30px;font-weight:800;line-height:1;color:var(--n900);font-family:var(--mono)}
    .stat-l{font-size:12px;color:var(--n500);margin-top:4px}

    /* PROJECT CARD */
    .pcard{background:#fff;border:1px solid var(--n200);border-radius:var(--r);padding:16px 20px;cursor:pointer;transition:all var(--tr);position:relative;overflow:hidden;margin:12px}
    .pcard:hover{border-color:var(--accent);box-shadow:var(--shm);transform:translateY(-1px)}
    .pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--success)}
    .pcard.s-warn::before{background:var(--warning)}
    .pcard.s-dang::before{background:var(--danger)}
    .pcard.s-blok::before{background:var(--danger-dk)}
    .pname{font-size:15px;font-weight:700;color:var(--n900)}
    .pmeta{font-size:12px;color:var(--n500);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
    .prog{height:5px;background:var(--n200);border-radius:99px;overflow:hidden;margin:10px 0}
    .prog-f{height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}

    /* BADGES */
    .bdg{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;display:inline-block}
    .b-norm{background:rgba(46,196,182,.12);color:#0d8a82}
    .b-warn{background:rgba(255,183,3,.15);color:#b37d00}
    .b-dang{background:rgba(230,57,70,.12);color:var(--danger)}
    .b-blok{background:rgba(155,30,38,.12);color:var(--danger-dk)}
    .b-done{background:rgba(46,196,182,.1);color:#0d8a82}
    .b-prog{background:rgba(232,97,10,.1);color:var(--accent)}
    .b-pend{background:rgba(136,136,136,.1);color:var(--n500)}
    .dl-0{background:#e8f5e9;color:#2e7d32}
    .dl-1{background:#fff8e1;color:#f57f17}
    .dl-2{background:#fff3e0;color:#e65100}
    .dl-3{background:#fce4ec;color:#b71c1c}
    .dl-4{background:#3d0000;color:#ff8a80}
    .r-unc{background:#f3f4f6;color:#6b7280}
    .r-pnd{background:#fef3c7;color:#92400e}
    .r-cfm{background:#d1fae5;color:#065f46}
    .r-exp{background:#fee2e2;color:#991b1b}

    /* MS ROW */
    .ms-table{width:100%}.ms-tr{transition:background .12s}.ms-tr:hover{background:var(--n100)!important}.ms-tr-alert{background:rgba(230,57,70,.05)!important}.ms-tr-alert:hover{background:rgba(230,57,70,.08)!important}
    
    

    /* BTN */
    .btn-ac{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);display:inline-flex;align-items:center;gap:6px}
    .btn-ac:hover{background:var(--accent-lt);transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,97,10,.3)}
    .btn-ic{width:30px;height:30px;border:1px solid var(--n200);border-radius:6px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--n700);transition:all var(--tr)}
    .btn-ic:hover{background:var(--n100)}
    .btn-ic.dl:hover{background:rgba(230,57,70,.08);border-color:var(--danger);color:var(--danger)}

    /* MODAL */
    .modal-content{border-radius:var(--r);border:none;box-shadow:var(--shl)}
    .modal-header{background:var(--n900);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:14px 20px;border-bottom:2px solid var(--accent)}
    .modal-title{font-size:14px;font-weight:700}
    .modal-header .btn-close{filter:invert(1)}
    .form-label{font-size:12px;font-weight:600;color:var(--n700);margin-bottom:4px}
    .form-control{border:1.5px solid var(--n200);border-radius:var(--r);padding:9px 12px;font-size:13px}
    .form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,97,10,.12);outline:none}

    /* LOADING/TOAST */
    .ld-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999}
    .ld-ring{width:44px;height:44px;border:3px solid rgba(232,97,10,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .t-msg{position:fixed;top:68px;right:20px;z-index:9999;min-width:280px;border-radius:var(--r);box-shadow:var(--shm);animation:sli .25s ease}
    @keyframes sli{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

    /* UTILS */
    .font-mono{font-family:var(--mono)}
    .fw6{font-weight:600}
    .sec-title{font-size:18px;font-weight:700;color:var(--n900);margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .empty{text-align:center;padding:48px 24px;color:var(--n500)}
    .empty i{font-size:48px;margin-bottom:12px;display:block}
    .impact-box{background:#fff;border:2px solid var(--danger);border-radius:var(--r);padding:24px}
    @media(max-width:768px){#sidebar{transform:translateX(-100%)}#main{margin-left:0}}
    /* Drag sort */
    .sort-mode .drag-handle{display:flex!important}
    .sort-mode tr[data-mid]{cursor:grab}
    .sort-mode tr[data-mid]:hover{background:rgba(232,97,10,.06)!important}
    .sort-mode .sort-only{display:inline-flex!important}
    .sort-mode .normal-only{display:none!important}
    .sort-only{display:none}
    .sort-mode .sort-badge{display:inline-flex!important;width:18px;height:18px}
    .ms-tr.drag-over{outline:2px solid var(--accent);background:rgba(232,97,10,.08)!important}
    .ms-tr.dragging{opacity:.35;background:var(--n100)!important}
    .sort-mode-banner{background:rgba(232,97,10,.1);border:1.5px solid var(--accent);border-radius:var(--r);
      padding:8px 16px;font-size:12px;color:var(--accent);font-weight:600;
      display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    #btn-sort-mode.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    /* Admin Tab */
    .nav-tabs .nav-link { color: var(--n700); border-color: transparent; font-size:13px; font-weight:600; }
    .nav-tabs .nav-link.active { color: var(--accent); border-bottom-color: var(--accent); background: transparent; }
    .nav-tabs .nav-link:hover { color: var(--accent); border-color: transparent; }
    .nav-tabs { border-bottom: 2px solid var(--n200); }

  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lg-bg"></div>
  <div class="lg-box">
    <div class="lg-logo"><img id="lg-img" alt="imPR Logo" /></div>
    <div class="lg-sys">Milestone Control System</div>
    <div class="mb-3"><div class="lg-lbl">帳號 ACCOUNT</div><input id="iu" type="text" class="lg-inp" placeholder="請輸入帳號" /></div>
    <div class="mb-4"><div class="lg-lbl">密碼 PASSWORD</div><input id="ip" type="password" class="lg-inp" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <button class="btn-lg" onclick="doLogin()"><i class="bi bi-box-arrow-in-right me-2"></i>登　入</button>
    <div id="lerr" style="color:#e63946;font-size:12px;text-align:center;margin-top:10px;display:none"></div>
    
  </div>
</div>

<!-- APP -->
<div id="app-shell" style="display:none">
  <aside id="sidebar">
    <div class="sb-brand"><img id="sb-img" class="sb-logo" alt="imPR" /></div>
    <nav class="sb-nav">
      <div class="nav-sec">主要功能</div>
      <a class="nav-a act" onclick="nav('dashboard')"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a class="nav-a" onclick="nav('projects')"><i class="bi bi-folder2-open"></i>專案管理</a>
      <a class="nav-a" onclick="nav('closed')"><i class="bi bi-archive"></i>已結案專案</a>
      <a class="nav-a" onclick="nav('resources')"><i class="bi bi-box-seam"></i>資源控管</a>
      <div class="nav-sec" style="margin-top:8px">分析工具</div>
      <a class="nav-a" onclick="nav('delay-sim')"><i class="bi bi-exclamation-triangle-fill"></i>延遲模擬</a>
      <a class="nav-a" onclick="nav('kpi-dash')"><i class="bi bi-speedometer2"></i>KPI 儀表板</a>
      <a class="nav-a" id="nav-adm" onclick="nav('admin')" style="display:none"><i class="bi bi-gear-fill"></i>系統管理</a>
    </nav>
    <div class="sb-user">
      <div class="u-ava" id="s-ava">?</div>
      <div style="flex:1"><div class="u-name" id="s-name">-</div><div class="u-role" id="s-role">-</div></div>
      <button class="btn-out" onclick="doLogout()" title="登出"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div><div class="top-title" id="t-title">Dashboard</div><div class="top-meta" id="t-meta"></div></div>
      <div class="d-flex align-items-center gap-2">
        <span id="t-clk" class="font-mono" style="font-size:11px;color:var(--n500)"></span>
        <button class="btn-ic" onclick="refresh()" title="重新整理"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>
    <div id="page"></div>
  </div>
</div>

<!-- MODAL: 新增專案 -->
<div class="modal fade" id="m-proj" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>新增專案</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-md-6"><label class="form-label">專案名稱 *</label><input id="fp-n" type="text" class="form-control" placeholder="例：2026 AI國際研討會" /></div>
      <div class="col-md-6"><label class="form-label">客戶名稱 *</label><input id="fp-c" type="text" class="form-control" placeholder="例：科技部" /></div>
      <div class="col-md-6"><label class="form-label">活動類型 *</label>
        <select id="fp-t" class="form-control"><option value="">請選擇</option><option>國際研討會</option><option>記者會</option><option>體驗活動</option><option>跨島大型活動</option><option>一般會議</option></select></div>
      <div class="col-md-6"><label class="form-label">活動日期</label><input id="fp-d" type="date" class="form-control" /></div>
      <div class="col-md-6"><label class="form-label">活動地點</label><input id="fp-l" type="text" class="form-control" placeholder="例：台北國際會議中心" /></div>
      <div class="col-md-3"><label class="form-label">活動天數</label><input id="fp-dy" type="number" class="form-control" value="1" min="1" /></div>
      <div class="col-md-3"><label class="form-label">預估人數</label><input id="fp-a" type="number" class="form-control" placeholder="0" /></div>
      <div class="col-md-6"><label class="form-label">PM 負責人</label><input id="fp-pm" type="text" class="form-control" /></div>
      <div class="col-12"><label class="form-label">特殊需求</label><div class="d-flex flex-wrap gap-3 mt-1">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="fp-fg"><label class="form-check-label" for="fp-fg">有外賓</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="fp-ac"><label class="form-check-label" for="fp-ac">需住宿</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="fp-fl"><label class="form-check-label" for="fp-fl">需機票/船票</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="fp-tr"><label class="form-check-label" for="fp-tr">需車輛接駁</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="fp-md"><label class="form-check-label" for="fp-md">需媒體邀請</label></div>
      </div></div>
      <div class="col-12"><label class="form-label">備註</label><textarea id="fp-nt" class="form-control" rows="2"></textarea></div>
    </div></div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
      <button class="btn-ac" onclick="submitProj()"><i class="bi bi-plus-circle"></i>建立專案並自動產生節點</button>
    </div>
  </div></div>
</div>

<!-- MODAL: 節點 -->
<div class="modal fade" id="m-ms" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="ms-ttl">新增節點</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="fm-id" /><input type="hidden" id="fm-pid" />
      <div class="row g-3">
        <div class="col-md-8"><label class="form-label">節點名稱 *</label><input id="fm-n" type="text" class="form-control" /></div>
        <div class="col-md-4"><label class="form-label">分類 Category</label>
          <select id="fm-cat" class="form-control">
            <option value="">請選擇</option>
            <option>前期規劃</option><option>場地規劃</option><option>內容議程</option>
            <option>宣傳報名</option><option>設計製作</option><option>輸出製作</option>
            <option>現場執行</option><option>結案成果</option>
          </select>
        </div>
        <div class="col-md-6"><label class="form-label">計畫完成日</label><input id="fm-pl" type="date" class="form-control" /></div>
        <div class="col-md-6"><label class="form-label">實際完成日</label><input id="fm-ac" type="date" class="form-control" /></div>
        <div class="col-md-6"><label class="form-label">狀態</label>
          <select id="fm-st" class="form-control"><option>未開始</option><option>進行中</option><option>已完成</option><option>延遲</option><option>卡關</option></select></div>
        <div class="col-md-6"><label class="form-label">負責角色</label>
          <select id="fm-rl" class="form-control"><option>PM</option><option>Staff</option><option>Admin</option></select></div>
        <div class="col-12">
          <div class="form-check"><input class="form-check-input" type="checkbox" id="fm-cr">
          <label class="form-check-label" for="fm-cr"><strong class="text-danger">🔴 設為關鍵節點</strong>（延遲將觸發警報）</label></div>
        </div>
        <div class="col-12"><label class="form-label">延遲原因</label><input id="fm-dr" type="text" class="form-control" /></div>
        <div class="col-12"><label class="form-label">受影響節點（逗號分隔）</label><input id="fm-af" type="text" class="form-control" placeholder="例：場地確認,住宿暫保" /></div>
        <div class="col-12"><label class="form-label">備註</label><textarea id="fm-nt" class="form-control" rows="2"></textarea></div>
      </div>

      <div class="row g-3">

<!-- ===== MODAL: 新增/編輯模版節點 ===== -->
<div class="modal fade" id="m-tmpl" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="tmpl-ttl">新增模版節點</h5>
      <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="ft-id" />
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">節點名稱 *</label>
          <input id="ft-n" type="text" class="form-control" placeholder="例：場地確認" />
        </div>
        <div class="col-md-4">
          <label class="form-label">負責角色</label>
          <select id="ft-rl" class="form-control">
            <option value="PM">PM</option>
            <option value="Staff">Staff</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">活動類型 *</label>
          <select id="ft-et" class="form-control">
            <option value="國際研討會">國際研討會</option>
            <option value="記者會">記者會</option>
            <option value="體驗活動">體驗活動</option>
            <option value="跨島大型活動">跨島大型活動</option>
            <option value="一般會議">一般會議</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">活動前幾週完成</label>
          <input id="ft-wb" type="number" step="0.5" class="form-control" placeholder="例：8" />
          <div style="font-size:10px;color:var(--n500);margin-top:3px">負數=活動後幾週，0=活動當天</div>
        </div>
        <div class="col-md-3">
          <label class="form-label">排序</label>
          <input id="ft-so" type="number" class="form-control" placeholder="1" min="1" />
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="ft-cr">
            <label class="form-check-label" for="ft-cr"><strong class="text-danger">🔴 設為關鍵節點</strong></label>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">節點說明</label>
          <textarea id="ft-desc" class="form-control" rows="2" placeholder="此節點的執行說明與注意事項"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">若延遲，影響哪些節點（逗號分隔）</label>
          <input id="ft-af" type="text" class="form-control" placeholder="例：住宿暫保,宣傳啟動" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
      <button class="btn-ac" onclick="submitTmpl()">儲存模版節點</button>
    </div>
  </div></div>
</div>

// ============================================================
// 全域狀態
// ============================================================
const APP = {token:null,user:null,page:'dashboard',proj:null};

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('lg-img').src = LOGO;
  document.getElementById('sb-img').src = LOGO;
  setInterval(()=>{
    const el=document.getElementById('t-clk');
    if(el) el.textContent=new Date().toLocaleString('zh-TW',{hour12:false});
  },1000);
  const t=localStorage.getItem('mcs_t'), u=localStorage.getItem('mcs_u');
  if(t&&u){ APP.token=t; APP.user=JSON.parse(u); showApp(); nav('dashboard'); }
});

// ============================================================
// 認證
// ============================================================
async function doLogin(){
  const u=document.getElementById('iu').value.trim();
  const p=document.getElementById('ip').value.trim();
  if(!u||!p){lerr('請輸入帳號與密碼');return;}
  ld(true);
  try{
    const r=await doPost({action:'login',username:u,password:p});
    if(r.success){
      APP.token=r.token; APP.user=r.user;
      localStorage.setItem('mcs_t',r.token);
      localStorage.setItem('mcs_u',JSON.stringify(r.user));
      showApp(); nav('dashboard');
    } else lerr(r.error||'登入失敗');
  }catch(e){
    lerr('連線失敗，請確認 GAS_URL 設定是否正確。\n錯誤：'+e.message);
  }finally{ld(false);}
}
function lerr(m){const el=document.getElementById('lerr');el.textContent=m;el.style.display='block';}
function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  document.getElementById('s-name').textContent=APP.user.displayName;
  document.getElementById('s-role').textContent=APP.user.role;
  document.getElementById('s-ava').textContent=APP.user.displayName.charAt(0);
  if(APP.user.role==='Admin') document.getElementById('nav-adm').style.display='flex';
}
function doLogout(){
  localStorage.removeItem('mcs_t'); localStorage.removeItem('mcs_u');
  APP.token=null; APP.user=null;
  document.getElementById('login').style.display='flex';
  document.getElementById('app-shell').style.display='none';
}

// ============================================================
// 路由
// ============================================================
function refresh(){nav(APP.page,APP.proj);}
function nav(page,param){
  APP.page=page;
  document.querySelectorAll('.nav-a').forEach(e=>e.classList.remove('act'));
  const idx={dashboard:0,projects:1,closed:2,resources:3,'delay-sim':4,'kpi-dash':5,admin:6};
  const items=document.querySelectorAll('.nav-a');
  if(idx[page]!==undefined&&items[idx[page]]) items[idx[page]].classList.add('act');
  switch(page){
    case 'dashboard':   loadDash();break;
    case 'projects':    loadProjs();break;
    case 'proj-detail': loadDetail(param);break;
    case 'closed':      loadClosed();break;
    case 'resources':   loadRes();break;
    case 'delay-sim':   loadDelay(param);break;
    case 'admin':       loadAdmin();break;
    case 'proj-stats':  loadProjStats(param);break;
    case 'logs':        loadLogs();break;
    case 'gantt':       loadGantt(param);break;
    case 'kpi-dash':    loadKpiDash(param);break;
    case 'proj-risk':   loadRiskReport(param);break;
  }
}

// ============================================================
// DASHBOARD
// ============================================================
async function loadDash(){
  setTop('Dashboard','imPR 會展節點控管系統');ld(true);
  try{
    const r=await doGet({action:'getDashboardData',token:APP.token});
    if(!r.success){apiErr(r);return;}
    const {summary:S,projects:P,upcomingResources:UR,overdueResources:OR}=r;
    const sc=s=>s==='卡關'?'s-blok':s==='延遲'?'s-dang':s==='注意'?'s-warn':'';

    const rc={未確認:'r-unc',暫保:'r-pnd',已確認:'r-cfm',已失效:'r-exp'};
    pg(`<div class="row g-3 mb-4">
      ${[{ic:'bi-folder2-open',cl:'ic-or',v:S.totalProjects,lb:'進行中專案'},
         {ic:'bi-check2-circle',cl:'ic-gr',v:(S.closedProjects||0),lb:'已結案'},
         {ic:'bi-exclamation-triangle-fill',cl:'ic-ye',v:S.delayedProjects,lb:'延遲專案'},
         {ic:'bi-alarm-fill',cl:'ic-re',v:S.criticalMilestoneDelays,lb:'關鍵節點延遲'}
        ].map(s=>`<div class="col-xl-3 col-md-6"><div class="stat">
          <div class="stat-ic ${s.cl}"><i class="bi ${s.ic}"></i></div>
          <div><div class="stat-v">${s.v}</div><div class="stat-l">${s.lb}</div></div>
        </div></div>`).join('')}
      </div>
      <div class="row g-3">
        <div class="col-xl-8">
          <div class="card">
            <div class="card-hdr"><span><i class="bi bi-kanban me-2"></i>專案總覽</span>
              ${canEdit()?`<button class="btn-ac" onclick="openProjM()"><i class="bi bi-plus"></i>新增專案</button>`:''}
            </div>
            ${P.length===0?`<div class="empty"><i class="bi bi-folder2"></i><p>尚無專案</p></div>`:
              P.map(p=>`<div class="pcard ${sc(p.status)}" onclick="nav('proj-detail','${p.projectId}')">
                <div class="d-flex justify-content-between align-items-start">
                  <div><div class="pname">${p.projectName}</div>
                    <div class="pmeta">
                      <span><i class="bi bi-building"></i>${p.clientName}</span>
                      <span><i class="bi bi-calendar3"></i>${fd(p.eventDate)||'日期待定'}</span>
                      <span><i class="bi bi-person-badge"></i>${p.pmName||'-'}</span>
                      <span style="background:rgba(232,97,10,.1);color:var(--accent);padding:1px 7px;border-radius:4px;font-size:10px">${p.eventType}</span>
                    </div>
                  </div>
                  <span class="bdg ${bc(p.status)}">${p.status}</span>
                </div>
                <div class="prog"><div class="prog-f" style="width:${p.progress}%;background:${p.progress<30?'var(--danger)':p.progress<70?'var(--warning)':'var(--accent)'}"></div></div>
                <div class="d-flex justify-content-between" style="font-size:11px;color:var(--n500)">
                  <span>${p.completedMilestones}/${p.totalMilestones} 節點</span>
                  <span class="font-mono">${p.progress}%</span>
                  ${p.delayedCount>0?`<span style="color:var(--danger)"><i class="bi bi-exclamation-circle me-1"></i>${p.delayedCount}個延遲</span>`:''}
                </div>
              </div>`).join('')}
          </div>
        </div>

// ============================================================
// 延遲模擬
// ============================================================
async function loadDelay(mid){
  setTop('延遲影響模擬','關鍵節點延遲連鎖分析');
  if(!mid){pg(`<div class="empty"><i class="bi bi-exclamation-triangle" style="color:var(--warning)"></i><p>請從專案詳細頁選取延遲節點</p><button class="btn-ac mt-3" onclick="nav('projects')">前往專案</button></div>`);return;}
  ld(true);
  try{
    const r=await doGet({action:'calculateDelayImpact',token:APP.token,milestoneId:mid});
    if(!r.success){apiErr(r);return;}
    const lc=['#e8f5e9','#fff8e1','#fff3e0','#fce4ec','#2d0000'];
    const lt=['正常','輕微（可內部吸收）','中度（需壓縮後續）','嚴重（需啟動調整方案）','危急（需重新排程）'];
    pg(`<div class="impact-box" style="border-color:${r.delayLevel>=3?'var(--danger-dk)':'var(--warning)'}">
      <div class="d-flex align-items-center gap-3 mb-3">
        <i class="bi bi-exclamation-octagon-fill" style="font-size:28px;color:var(--danger)"></i>
        <div><div style="font-size:17px;font-weight:700">${r.milestoneName}</div>
          <div style="font-size:12px;color:var(--n500)">計畫日期：${fd(r.plannedDate)}</div></div>
        ${r.isCritical==='TRUE'?'<span class="bdg b-dang ms-auto">🔴 關鍵節點</span>':''}
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div style="font-size:11px;color:var(--n500)">延遲天數</div>
          <div style="font-size:40px;font-weight:900;font-family:var(--mono);color:var(--danger)">+${r.delayDays}</div></div>
        <div class="col-md-4"><div style="font-size:11px;color:var(--n500)">延遲等級</div>
          <div style="background:${lc[r.delayLevel]};color:var(--danger);padding:4px 14px;border-radius:99px;font-weight:700;font-size:13px;display:inline-block;margin-top:4px">Level ${r.delayLevel}：${lt[r.delayLevel]}</div></div>
        <div class="col-md-5"><div style="font-size:11px;color:var(--n500)">受影響節點</div>
          <div style="font-size:26px;font-weight:700;color:var(--warning)">${r.affectedCount} 個</div>
          ${r.criticalAffectedCount>0?`<div style="font-size:11px;color:var(--danger)">⚠ 含 ${r.criticalAffectedCount} 個關鍵節點</div>`:''}</div>
      </div>
      ${r.affectedMilestones.length>0?`<div class="mb-4">
        <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--n700)">受影響節點列表</div>
        <table class="table table-sm table-bordered" style="font-size:12px">
          <thead style="background:var(--n100)"><tr><th>節點名稱</th><th>原計畫日</th><th>預估新日期</th><th>關鍵</th><th>狀態</th></tr></thead>
          <tbody>${r.affectedMilestones.map(m=>`<tr class="${m.isCritical==='TRUE'?'table-danger':''}">
            <td>${m.milestoneName}</td>
            <td class="font-mono">${fd(m.plannedDate)}</td>
            <td class="font-mono" style="color:var(--danger)">${m.estimatedNewDate}</td>
            <td>${m.isCritical==='TRUE'?'🔴':'-'}</td>
            <td>${m.status}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>`:''}
      <div><div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--n700)">建議處理行動</div>
        ${r.recommendations.map(rec=>`<div style="padding:9px 12px;background:var(--n100);border-radius:6px;font-size:13px;margin-bottom:6px;border-left:3px solid var(--accent)">${rec}</div>`).join('')}
      </div>
    </div>`);
  }finally{ld(false);}
}

          <td class="font-mono">${fd(res.cutoffDate)||'-'}</td><td>${res.quantity}</td>
          <td class="font-mono">NT$${Number(res.totalCost||0).toLocaleString()}</td>
          <td style="color:${res.riskLevel==='高'?'var(--danger)':res.riskLevel==='中'?'var(--warning)':'var(--success)'}">${res.riskLevel}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`);
  }finally{ld(false);}
}

function tmplWeekLabel(wb){
  const w = Number(wb);
  if(w === 0) return '<span class="bdg b-prog" style="font-size:10px">活動當天</span>';
  if(w < 0)   return `<span class="bdg b-norm" style="font-size:10px">活動後 ${Math.abs(w)} 週</span>`;
  if(w < 1)   return `<span class="bdg b-warn" style="font-size:10px">活動前 ${Math.round(w*7)} 天</span>`;
  return `<span class="bdg b-dang" style="font-size:10px">T-${w}週</span>`;
}

// ── 模版新增/編輯 Modal ───────────────────────────────────────
function openTmplM(tid, defaultType, existing){
  document.getElementById('tmpl-ttl').textContent = tid ? '編輯模版節點' : '新增模版節點';
  document.getElementById('ft-id').value = tid || '';
  if(existing){
    document.getElementById('ft-n').value    = existing.milestoneName || '';
    document.getElementById('ft-et').value   = existing.eventType || defaultType || '國際研討會';
    document.getElementById('ft-wb').value   = existing.weeksBefore || '';
    document.getElementById('ft-so').value   = existing.sortOrder || '';
    document.getElementById('ft-cr').checked = existing.isCritical === 'TRUE';
    document.getElementById('ft-rl').value   = existing.defaultRole || 'PM';
    document.getElementById('ft-desc').value = existing.description || '';
    document.getElementById('ft-af').value   = existing.affectedMilestones || '';
    // 編輯模式下鎖定活動類型（避免誤改）
    document.getElementById('ft-et').disabled = true;
  } else {
    ['ft-n','ft-desc','ft-af'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ft-et').value   = defaultType || APP._tmplFilter || '國際研討會';
    document.getElementById('ft-et').disabled = false;
    document.getElementById('ft-wb').value   = '';
    document.getElementById('ft-so').value   = '';
    document.getElementById('ft-cr').checked = false;
    document.getElementById('ft-rl').value   = 'PM';
  }
  new bootstrap.Modal(document.getElementById('m-tmpl')).show();
}

async function submitTmpl(){
  const tid  = document.getElementById('ft-id').value;
  const name = document.getElementById('ft-n').value.trim();
  const et   = document.getElementById('ft-et').value;
  const wb   = document.getElementById('ft-wb').value;
  if(!name){toast('warning','請填寫節點名稱');return;}
  if(!et){toast('warning','請選擇活動類型');return;}
  if(wb===''||wb===null){toast('warning','請填寫完成時機（活動前幾週）');return;}

  const data = {
    milestoneName:      name,
    eventType:          et,
    weeksBefore:        Number(wb),
    isCritical:         document.getElementById('ft-cr').checked,
    defaultRole:        document.getElementById('ft-rl').value,
    description:        document.getElementById('ft-desc').value,
    affectedMilestones: document.getElementById('ft-af').value,
    sortOrder:          Number(document.getElementById('ft-so').value) || null
  };

  ld(true);
  try{
    const r = tid
      ? await doPost({action:'updateTemplate', token:APP.token, templateId:tid, data})
      : await doPost({action:'addTemplate',    token:APP.token, data});

    if(r.success){
      bootstrap.Modal.getInstance(document.getElementById('m-tmpl')).hide();
      toast('success', tid ? '模版節點已更新' : '模版節點已新增');
      document.getElementById('tab-tmpl').dataset.loaded = '';
      loadTmplTab(et);
    } else toast('danger', r.error);
  }finally{ld(false);}
}

async function delTmpl(tid, name){
  if(!confirm(`確定要刪除模版節點「${name}」？\n\n⚠ 此操作不影響已建立的專案節點，僅移除模版。`)) return;
  ld(true);
  try{
    const r = await doPost({action:'deleteTemplate', token:APP.token, templateId:tid});
    if(r.success){
      toast('success','模版節點已刪除');
      document.getElementById('tab-tmpl').dataset.loaded = '';
      loadTmplTab(APP._tmplFilter);
    } else toast('danger', r.error);
  }finally{ld(false);}
}

// 複製節點到其他活動類型
async function dupTmpl(tid){
  const target = prompt('請輸入要複製到的活動類型：\n\n國際研討會 / 記者會 / 體驗活動 / 跨島大型活動 / 一般會議');
  if(!target) return;
  if(!EVENT_TYPES.includes(target)){toast('warning','活動類型名稱不正確');return;}

  // 先取得原始模版資料
  const r = await doGet({action:'getTemplates', token:APP.token, eventType:APP._tmplFilter});
  if(!r.success){toast('danger',r.error);return;}
  const orig = r.templates.find(t=>t.templateId===tid);
  if(!orig){toast('danger','找不到原始模版');return;}

  ld(true);
  try{
    const r2 = await doPost({action:'addTemplate', token:APP.token, data:{
      ...orig, eventType:target, templateId:undefined
    }});
    if(r2.success){
      toast('success',`已複製至「${target}」`);
    } else toast('danger', r2.error);
  }finally{ld(false);}
}

async function submitUser(){
  const uid  = document.getElementById('fu-id').value;
  const un   = document.getElementById('fu-un').value.trim();
  const pw   = document.getElementById('fu-pw').value.trim();
  const dn   = document.getElementById('fu-dn').value.trim();
  const rl   = document.getElementById('fu-rl').value;
  const em   = document.getElementById('fu-em').value.trim();

  if(!uid && (!un||!pw||!dn)){toast('warning','請填寫帳號、密碼與顯示名稱');return;}
  if(uid && !dn){toast('warning','請填寫顯示名稱');return;}

  ld(true);
  try{
    let r;
    if(uid){
      const data = {displayName:dn, role:rl, email:em};
      if(pw) data.password = pw;
      r = await doPost({action:'updateUser', token:APP.token, userId:uid, data});
    } else {
      r = await doPost({action:'addUser', token:APP.token, data:{username:un,password:pw,displayName:dn,role:rl,email:em}});
    }
    if(r.success){
      bootstrap.Modal.getInstance(document.getElementById('m-user')).hide();
      toast('success', uid ? '帳號已更新' : '帳號已建立');
      document.getElementById('tab-user').dataset.loaded = '';
      loadUserTab();
    } else toast('danger', r.error);
  }finally{ld(false);}
}

async function toggleUserActive(uid, username, currentActive){
  const action = currentActive ? '停用' : '啟用';
  if(!confirm(`確定要${action}帳號「${username}」？`)) return;
  ld(true);
  try{
    const r = await doPost({action:'updateUser', token:APP.token, userId:uid, data:{active:!currentActive}});
    if(r.success){
      toast('success', `帳號已${action}`);
      document.getElementById('tab-user').dataset.loaded = '';
      loadUserTab();
    } else toast('danger', r.error);
  }finally{ld(false);}
}

// ============================================================
// ★ API 呼叫 — CORS 修正版
// GAS Web App 的 CORS 限制解法：
// 1. GET：加 redirect:'follow'（GAS 會 302 跳轉）
// 2. POST：不設 Content-Type header（避免 preflight）
// ============================================================
async function doGet(params){
  const qs=new URLSearchParams(params).toString();
  const res=await fetch(`${GAS_URL}?${qs}`,{method:'GET',redirect:'follow'});
  if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
  const txt=await res.text();
  try{return JSON.parse(txt);}catch(e){throw new Error('回應不是有效 JSON：'+txt.substring(0,100));}
}
async function doPost(body){
  const res=await fetch(GAS_URL,{
    method:'POST',
    redirect:'follow',
    // 不設 Content-Type → 瀏覽器預設 text/plain → 不觸發 CORS preflight
    body:JSON.stringify(body)
  });
  if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
  const txt=await res.text();
  try{return JSON.parse(txt);}catch(e){throw new Error('回應不是有效 JSON：'+txt.substring(0,100));}
}

function pg(html){document.getElementById('page').innerHTML=html;}
function setTop(t,m){document.getElementById('t-title').textContent=t;document.getElementById('t-meta').textContent=m||'';}
function canEdit(){return APP.user&&['Admin','PM'].includes(APP.user.role);}
function fd(d){if(!d)return'';try{const dt=new Date(d);return isNaN(dt)?d:dt.toLocaleDateString('zh-TW');}catch{return d;}}
function ld(show){const id='__ld';if(show&&!document.getElementById(id)){const el=document.createElement('div');el.id=id;el.className='ld-ov';el.innerHTML='<div class="ld-ring"></div>';document.body.appendChild(el);}else if(!show){const el=document.getElementById(id);if(el)el.remove();}}
function toast(type,msg){const ex=document.querySelector('.t-msg');if(ex)ex.remove();const ic={success:'check-circle-fill',danger:'x-circle-fill',warning:'exclamation-triangle-fill'};const el=document.createElement('div');el.className=`alert alert-${type} alert-dismissible t-msg`;el.innerHTML=`<i class="bi bi-${ic[type]||'info-circle'} me-2"></i>${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;document.body.appendChild(el);setTimeout(()=>el.remove(),4500);}

async function doCloseProject(pid,pname){

}

// ============================================================
// 甘特圖頁面
// ============================================================
async function loadGantt(pid){
  APP.proj=pid;
  setTop('甘特圖','籌備時程視覺化');ld(true);
  try{
    const r=await doGet({action:'getGanttData',token:APP.token,projectId:pid});
    if(!r.success){apiErr(r);return;}
    const{projectName,eventDate,minDate,maxDate,ganttRows}=r;

    // 計算日期範圍（週）
    const start=new Date(minDate); start.setDate(start.getDate()-7);
    const end  =new Date(maxDate); end.setDate(end.getDate()+14);
    const totalDays=Math.max(1,Math.ceil((end-start)/86400000));

    const pct=(dateStr)=>{
      if(!dateStr)return null;
      const d=new Date(dateStr);
      const days=Math.ceil((d-start)/86400000);
      return Math.max(0,Math.min(100,days/totalDays*100));
    };

    const statusColor={
      '未開始':'var(--n300)','進行中':'var(--accent)',
      '已完成':'var(--success)','延遲':'var(--warning)','卡關':'var(--danger)'
    };
    const riskBg={'normal':'transparent','warning':'rgba(255,183,3,.06)','error':'rgba(230,57,70,.06)','critical':'rgba(155,30,38,.08)'};
    const today=new Date(); today.setHours(0,0,0,0);
    const todayPct=pct(today.toISOString().split('T')[0]);

    // Build week labels
    const weeks=[];
    let d=new Date(start);
    while(d<=end){
      weeks.push({label:d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}),pct:pct(d.toISOString().split('T')[0])});
      d=new Date(d); d.setDate(d.getDate()+7);
    }

    pg(`
      <div class="d-flex align-items-center gap-2 mb-3" style="font-size:12px;color:var(--n500)">
        <a style="cursor:pointer;color:var(--accent)" onclick="nav('proj-detail','${pid}')">← 返回專案</a>
        <i class="bi bi-chevron-right"></i><span>甘特圖</span>
      </div>
      <div class="card" style="overflow:hidden">
        <!-- Header -->
        <div style="background:linear-gradient(90deg,var(--n900),var(--n700));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between">
          <span style="font-weight:700;font-size:15px"><i class="bi bi-bar-chart-steps me-2"></i>${projectName} — 甘特圖</span>
          <span style="font-size:11px;opacity:.6;font-family:var(--mono)">${minDate} → ${maxDate}</span>
        </div>
        <!-- Legend -->
        <div style="padding:10px 20px;background:var(--n100);border-bottom:1px solid var(--n200);display:flex;gap:16px;flex-wrap:wrap;font-size:11px">
          ${['未開始','進行中','已完成','延遲','卡關'].map(s=>`
            <span style="display:flex;align-items:center;gap:5px">
              <span style="width:12px;height:12px;border-radius:3px;background:${statusColor[s]};display:inline-block"></span>${s}
            </span>`).join('')}
          <span style="display:flex;align-items:center;gap:5px;margin-left:8px">
            <span style="color:var(--danger);font-size:14px">🔴</span>關鍵節點
          </span>
          <span style="display:flex;align-items:center;gap:5px">
            <span style="width:2px;height:14px;background:var(--accent);display:inline-block"></span>今日
          </span>
        </div>
        <!-- Gantt body -->
        <div style="overflow-x:auto">
          <div style="min-width:900px">
            <!-- Week ruler -->
            <div style="display:grid;grid-template-columns:220px 1fr;border-bottom:2px solid var(--n200)">
              <div style="padding:6px 12px;font-size:10px;font-weight:700;color:var(--n500);text-transform:uppercase;background:var(--n100)">節點名稱</div>
              <div style="position:relative;height:28px;background:var(--n100)">
                ${weeks.map(w=>`<span style="position:absolute;left:${w.pct}%;font-size:10px;color:var(--n500);transform:translateX(-50%);top:6px;white-space:nowrap">${w.label}</span>`).join('')}
                ${todayPct!==null?`<div style="position:absolute;left:${todayPct}%;top:0;bottom:0;width:2px;background:var(--accent);opacity:.5"></div>`:''}
              </div>
            </div>
            <!-- Rows -->
            ${ganttRows.map(row=>{
              if(row.type==='category'){
                return `<div style="display:grid;grid-template-columns:220px 1fr;background:rgba(232,97,10,.08);border-bottom:1px solid rgba(232,97,10,.2)">
                  <div style="padding:7px 12px;font-size:12px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px">
                    <i class="bi bi-folder-fill" style="font-size:10px"></i>${row.name}
                    <span style="font-size:10px;color:var(--n500);font-weight:400">${row.done}/${row.total}</span>
                    ${row.delayed>0?`<span style="font-size:10px;color:var(--danger)">⚠${row.delayed}</span>`:''}
                  </div>
                  <div style="padding:7px 12px;display:flex;align-items:center">
                    <div style="flex:1;height:6px;background:var(--n200);border-radius:99px;overflow:hidden;position:relative">
                      <div style="position:absolute;left:${todayPct}%;top:0;bottom:0;width:1px;background:var(--accent);z-index:2"></div>
                      <div style="height:100%;border-radius:99px;background:${row.delayed>0?'var(--warning)':row.progress===100?'var(--success)':'var(--accent)'};width:${row.progress}%"></div>
                    </div>
                    <span style="font-size:10px;font-family:var(--mono);color:var(--n500);margin-left:8px;width:32px">${row.progress}%</span>
                  </div>
                </div>`;
              }
              // milestone row
              const barLeft=pct(row.plannedDate);
              const barColor=statusColor[row.status]||'var(--n300)';
              const barW=3; // fixed width in %
              return `<div style="display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--n200);background:${riskBg['normal']}" onmouseover="this.style.background='var(--n100)'" onmouseout="this.style.background='${riskBg['normal']}'">
                <div style="padding:5px 12px 5px 20px;font-size:12px;display:flex;align-items:center;gap:4px;overflow:hidden">
                  ${row.isCritical?'<span style="color:var(--danger);font-size:10px;flex-shrink:0">🔴</span>':'<span style="width:14px;flex-shrink:0"></span>'}
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${row.status==='延遲'||row.status==='卡關'?'var(--danger)':'var(--n900)'}">${row.name}</span>
                  ${row.delayDays>0?`<span style="font-size:10px;color:var(--danger);font-family:var(--mono);flex-shrink:0">+${row.delayDays}d</span>`:''}
                </div>
                <div style="position:relative;padding:5px 0">
                  ${todayPct!==null?`<div style="position:absolute;left:${todayPct}%;top:0;bottom:0;width:1px;background:rgba(232,97,10,.3)"></div>`:''}
                  ${barLeft!==null?`
                    <div style="position:absolute;left:${barLeft}%;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px">
                      <div style="width:${Math.max(barW,2)}%;min-width:8px;height:${row.isCritical?14:10}px;background:${barColor};border-radius:3px;border:${row.isCritical?'1.5px solid rgba(0,0,0,.2)':'none'}" title="${row.name} | ${row.status} | ${row.plannedDate}"></div>
                      ${row.status==='已完成'?'<i class="bi bi-check-circle-fill" style="font-size:10px;color:var(--success)"></i>':''}
                    </div>
                  `:'<div style="position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--n300)">日期未定</div>'}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    `);
  }catch(e){toast('danger','甘特圖載入失敗：'+e.message);}
  finally{ld(false);}
}

// 風險分析報告頁

    ]);
    if(!dr.success){apiErr(dr);return;}
    if(!rr.success){apiErr(rr);return;}
    const p=dr.project;
    const{overallRisk,catRisks,cascadeAlerts,kpiSummary}=rr;

    const riskLabel={normal:'正常',warning:'注意',error:'風險',critical:'危急'};
    const riskBg   ={normal:'var(--success)',warning:'var(--warning)',error:'var(--danger)',critical:'var(--danger-dk)'};
    const riskBgLt ={normal:'rgba(46,196,182,.1)',warning:'rgba(255,183,3,.12)',error:'rgba(230,57,70,.1)',critical:'rgba(155,30,38,.15)'};

    const KPI_LABELS={PLAN:'前期規劃',VENUE:'場地規劃',CONTENT:'內容議程',DESIGN:'設計製作',OUTPUT:'輸出製作',ONSITE:'現場執行',PROMO:'宣傳報名',CLOSE:'結案成果',OTHER:'其他'};
    const KPI_THRESH={PLAN:{warn:30,error:60},VENUE:{warn:14,error:30},CONTENT:{warn:14,error:21},DESIGN:{warn:7,error:14},OUTPUT:{warn:3,error:7},ONSITE:{warn:1,error:3},PROMO:{warn:7,error:14},CLOSE:{warn:14,error:30},OTHER:{warn:7,error:14}};

    pg(`
      <div class="d-flex align-items-center gap-2 mb-3" style="font-size:12px;color:var(--n500)">
        <a style="cursor:pointer;color:var(--accent)" onclick="nav('proj-detail','${pid}')">← 返回專案</a>
        <i class="bi bi-chevron-right"></i><span>風險分析</span>
      </div>

      <!-- Overall Risk Banner -->

        <i class="bi bi-shield-${overallRisk==='normal'?'check':'exclamation'}-fill" style="font-size:32px;opacity:.9"></i>
        <div>
          <div style="font-size:11px;opacity:.8;letter-spacing:1px;text-transform:uppercase">整體專案風險</div>
          <div style="font-size:24px;font-weight:900">${riskLabel[overallRisk]} ${overallRisk==='critical'?'⚠ 需立即處理':overallRisk==='error'?'⚠ 需關注':''}</div>
          <div style="font-size:12px;opacity:.8">${p.projectName}</div>
        </div>
        ${cascadeAlerts.length>0?`<div style="margin-left:auto;background:rgba(0,0,0,.2);border-radius:8px;padding:8px 14px;text-align:center">
          <div style="font-size:22px;font-weight:900">${cascadeAlerts.length}</div>
          <div style="font-size:10px;opacity:.8">連鎖警報</div>
        </div>`:''}
      </div>

      <div class="row g-3">
        <!-- Category Risk Cards -->
        <div class="col-lg-7">
          <div class="card mb-3">
            <div class="card-hdr"><span><i class="bi bi-grid-3x2-gap me-2"></i>分類風險矩陣</span></div>
            <div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
              ${catOrder.map(cat=>{
                const s=catRisks[cat];
                if(!s)return'';
                const rl=s.riskLevel||'normal';
                return `<div style="border-radius:8px;padding:12px;background:${riskBgLt[rl]};border:1.5px solid ${riskBg[rl]}">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                    <span style="font-size:12px;font-weight:700;color:var(--n900)">${cat}</span>
                    <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:${riskBg[rl]};color:#fff">${riskLabel[rl]}</span>
                  </div>
                  <div style="height:6px;background:rgba(0,0,0,.1);border-radius:99px;overflow:hidden;margin-bottom:6px">
                    <div style="height:100%;border-radius:99px;background:${riskBg[rl]};width:${s.progress}%"></div>
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--n700)">
                    <span>${s.done}/${s.total} 完成</span>
                    ${s.maxDelay>0?`<span style="color:var(--danger);font-weight:700">延遲 +${s.maxDelay}天</span>`:
                      `<span style="color:var(--success)">✓ 正常</span>`}
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>

          <!-- Cascade Alerts -->
          ${cascadeAlerts.length>0?`
          <div class="card">
            <div class="card-hdr" style="border-left:3px solid var(--danger)">
              <span style="color:var(--danger)"><i class="bi bi-link-45deg me-2"></i>連鎖影響警報（${cascadeAlerts.length}）</span>
            </div>
            ${cascadeAlerts.map(a=>`
              <div style="padding:12px 16px;border-bottom:1px solid var(--n200);background:${riskBgLt[a.riskLevel]}">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                  <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:${riskBg[a.riskLevel]};color:#fff">${riskLabel[a.riskLevel]}</span>
                  <span style="font-size:13px;font-weight:700">${a.sourceCat}</span>
                  <span style="font-size:11px;color:var(--danger);font-family:var(--mono)">+${a.maxDelay}天</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                  <i class="bi bi-arrow-right" style="color:var(--danger)"></i>
                  ${a.downstream.map(d=>`<span style="background:rgba(230,57,70,.1);color:var(--danger);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">${d}</span>`).join('')}
                </div>
                <div style="font-size:11px;color:var(--n500);margin-top:6px">${a.message}</div>
              </div>`).join('')}
          </div>`:''}
        </div>

        <!-- KPI Panel -->
        <div class="col-lg-5">
          <div class="card mb-3">
            <div class="card-hdr"><span><i class="bi bi-speedometer2 me-2"></i>KPI 健康指標</span></div>
            <div style="padding:14px">
              ${Object.entries(kpiSummary).map(([kpi,s])=>{
                const thresh=KPI_THRESH[kpi]||KPI_THRESH.OTHER;
                const status=s.maxDelay>=thresh.error?'error':s.maxDelay>=thresh.warn||s.delayed>0?'warning':'normal';
                const kpiIcon={PLAN:'calendar3',VENUE:'geo-alt',CONTENT:'file-text',DESIGN:'palette',OUTPUT:'printer',ONSITE:'people',PROMO:'megaphone',CLOSE:'archive',OTHER:'dot'};
                const prog=s.total>0?Math.round(s.done/s.total*100):0;
                return `<div style="margin-bottom:12px;padding:10px;border-radius:6px;background:${riskBgLt[status]};border:1px solid ${status==='normal'?'var(--n200)':riskBg[status]}">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                    <span style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px">
                      <i class="bi bi-${kpiIcon[kpi]||'dot'}" style="color:${riskBg[status]}"></i>
                      ${KPI_LABELS[kpi]||kpi}
                    </span>
                    <div style="display:flex;align-items:center;gap:6px">
                      ${s.maxDelay>0?`<span style="font-size:10px;font-family:var(--mono);color:var(--danger)">+${s.maxDelay}d</span>`:''}
                      <span style="font-size:10px;padding:1px 7px;border-radius:99px;background:${riskBg[status]};color:#fff;font-weight:700">${{normal:'正常',warning:'注意',error:'風險'}[status]||status}</span>
                    </div>
                  </div>
                  <div style="height:8px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;position:relative">
                    <div style="height:100%;border-radius:99px;background:${riskBg[status]};width:${prog}%;transition:width .5s"></div>
                    ${thresh?`<div style="position:absolute;left:${Math.round(thresh.warn/(thresh.error||30)*100)}%;top:0;bottom:0;width:2px;background:rgba(255,183,3,.6)"></div>`:''}
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--n500);margin-top:4px">
                    <span>${s.done}/${s.total} 完成 · ${prog}%</span>
                    <span>警戒線：${thresh.warn}天 / 危急線：${thresh.error}天</span>
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>
    `);
  }catch(e){toast('danger','載入失敗：'+e.message);}
  finally{ld(false);}
}

// ============================================================
// 全域 KPI Dashboard
// ============================================================
async function loadKpiDash(pid){
  setTop('KPI 儀表板','跨專案 Category 健康指標');ld(true);
  try{
    const pr=await doGet({action:'getProjects',token:APP.token});
    if(!pr.success){apiErr(pr);return;}
    const projects=pr.projects.filter(p=>p.projectStatus==='進行中');

    // Load risk for all active projects in parallel
    const riskResults=await Promise.all(
      projects.slice(0,10).map(p=>doGet({action:'getProjectRiskReport',token:APP.token,projectId:p.projectId}).catch(()=>null))
    );

    const riskLabel={normal:'正常',warning:'注意',error:'風險',critical:'危急'};
    const riskBg={normal:'var(--success)',warning:'var(--warning)',error:'var(--danger)',critical:'var(--danger-dk)'};
    const riskIcon={normal:'check-circle-fill',warning:'exclamation-triangle-fill',error:'x-circle-fill',critical:'exclamation-octagon-fill'};

    pg(`
      <div class="sec-title"><i class="bi bi-speedometer2"></i>KPI 儀表板</div>
      ${projects.length===0?`<div class="empty"><i class="bi bi-folder2"></i><p>目前無進行中專案</p></div>`:`

      <!-- Summary Row -->
      <div class="row g-3 mb-4">
        ${(()=>{
          const totals={normal:0,warning:0,error:0,critical:0};
          riskResults.forEach(r=>{ if(r&&r.success) totals[r.overallRisk]=(totals[r.overallRisk]||0)+1; });
          return[
            {v:totals.normal,  lb:'正常專案',   cl:'ic-gr',ic:'check-circle-fill'},
            {v:totals.warning, lb:'注意',        cl:'ic-ye',ic:'exclamation-triangle-fill'},
            {v:totals.error,   lb:'風險',        cl:'ic-re',ic:'x-circle-fill'},
            {v:totals.critical,lb:'危急',        cl:'ic-re',ic:'exclamation-octagon-fill'},
          ].map(s=>`<div class="col-md-3"><div class="stat">
            <div class="stat-ic ${s.cl}"><i class="bi bi-${s.ic}"></i></div>
            <div><div class="stat-v">${s.v}</div><div class="stat-l">${s.lb}</div></div>
          </div></div>`).join('');
        })()}
      </div>

      <!-- Per-project KPI grid -->
      <div class="row g-3">
        ${projects.map((p,i)=>{
          const rr=riskResults[i];
          if(!rr||!rr.success) return `<div class="col-lg-6"><div class="card"><div class="card-body p-3 text-muted" style="font-size:12px">${p.projectName} — 載入失敗</div></div></div>`;
          const or=rr.overallRisk;
          const alerts=rr.cascadeAlerts||[];
          const catOrder=['前期規劃','場地規劃','內容議程','宣傳報名','設計製作','輸出製作','現場執行','結案成果'];
          return `<div class="col-lg-6">
            <div class="card" style="cursor:pointer;border-top:3px solid ${riskBg[or]}" onclick="nav('proj-risk','${p.projectId}')">
              <div class="card-hdr" style="background:${or!=='normal'?`rgba(230,57,70,.04)`:'#fff'}">
                <div>
                  <div style="font-size:13px;font-weight:700">${p.projectName}</div>
                  <div style="font-size:11px;color:var(--n500)">${p.clientName} · ${p.eventType}</div>
                </div>
                <span style="padding:4px 12px;border-radius:99px;background:${riskBg[or]};color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px">
                  <i class="bi bi-${riskIcon[or]}"></i>${riskLabel[or]}
                </span>
              </div>
              <div style="padding:12px 16px">
                <!-- Mini category bars -->
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">
                  ${catOrder.map(cat=>{
                    const s=rr.catRisks[cat];
                    if(!s) return '<div></div>';
                    const rl=s.riskLevel||'normal';
                    return `<div style="text-align:center" title="${cat}: ${s.done}/${s.total} 完成${s.maxDelay>0?' | 延遲'+s.maxDelay+'天':''}">
                      <div style="height:32px;background:var(--n200);border-radius:4px;overflow:hidden;position:relative;margin-bottom:3px">
                        <div style="position:absolute;bottom:0;left:0;right:0;height:${s.progress}%;background:${riskBg[rl]};transition:height .5s"></div>
                      </div>
                      <div style="font-size:9px;color:${riskBg[rl]};font-weight:700;line-height:1.2">${cat.slice(0,2)}</div>
                    </div>`;
                  }).join('')}
                </div>
                ${alerts.length>0?`<div style="background:rgba(230,57,70,.08);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--danger)">
                  <i class="bi bi-link-45deg me-1"></i>${alerts.length} 個連鎖警報：${alerts.map(a=>a.sourceCat).join('、')}
                </div>`:'<div style="font-size:11px;color:var(--success)"><i class="bi bi-check-circle me-1"></i>無連鎖風險</div>'}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    `);
  }catch(e){toast('danger','KPI載入失敗：'+e.message);}
  finally{ld(false);}
}

// ============================================================
// 節點排序功能（拖曳排序 + 上移/下移）
// ============================================================

let _sortMode    = false;   // 是否在排序模式
let _sortProjId  = null;    // 當前排序的專案 ID
let _dragSrcEl   = null;    // 正在拖曳的元素

/**
 * 切換排序模式
 */
function toggleSortMode(pid) {
  _sortMode   = !_sortMode;
  _sortProjId = pid;
  const btn     = document.getElementById('btn-sort-mode');
  const list    = document.querySelector('tbody.ms-list-wrap');
  const banner  = document.getElementById('sort-banner');

  if (!list) return;

  if (_sortMode) {
    // 進入排序模式
    list.classList.add('sort-mode');
    if (btn) btn.classList.add('active');
    // 顯示 banner
    if (banner) banner.style.display = 'flex';
    // 讓每列可拖曳
    list.querySelectorAll('tr[data-mid]').forEach(row => {
      row.setAttribute('draggable', 'true');
    });
    bindDragEvents(list);
  } else {
    exitSortMode(false);
  }
}

/**
 * 離開排序模式
 */
function exitSortMode(reload) {
  _sortMode = false;
  const btn  = document.getElementById('btn-sort-mode');
  const list = document.querySelector('tbody.ms-list-wrap');
  const banner = document.getElementById('sort-banner');

  if (list) {
    list.classList.remove('sort-mode');
    list.querySelectorAll('tr[data-mid]').forEach(row => {
      row.setAttribute('draggable', 'false');
      row.classList.remove('dragging','drag-over');
    });
  }
  if (btn) btn.classList.remove('active');
  if (banner) banner.style.display = 'none';

  if (reload && _sortProjId) loadDetail(_sortProjId);
}

/**
 * 綁定拖曳事件
 */
function bindDragEvents(container) {
  // container is tbody.ms-list-wrap
  container.querySelectorAll('tr[data-mid]').forEach(row => {
    row.addEventListener('dragstart', onDragStart);
    row.addEventListener('dragover',  onDragOver);
    row.addEventListener('dragleave', onDragLeave);
    row.addEventListener('drop',      onDrop);
    row.addEventListener('dragend',   onDragEnd);
  });
}

function onDragStart(e) {
  _dragSrcEl = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', this.dataset.mid);
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (this === _dragSrcEl) return;
  this.classList.add('drag-over');
}

function onDragLeave() {
  this.classList.remove('drag-over');
}

function onDrop(e) {
  e.stopPropagation();
  e.preventDefault();
  this.classList.remove('drag-over');
  if (!_dragSrcEl || _dragSrcEl === this) return;

  // Reorder DOM
  const parent = this.parentNode;
  const srcIdx = [...parent.children].indexOf(_dragSrcEl);
  const tgtIdx = [...parent.children].indexOf(this);

  if (srcIdx < tgtIdx) {
    parent.insertBefore(_dragSrcEl, this.nextSibling);
  } else {
    parent.insertBefore(_dragSrcEl, this);
  }
  // Update visual sortOrder badges
  updateSortBadges(parent);
}

function onDragEnd() {
  document.querySelectorAll('.ms-row').forEach(r => r.classList.remove('dragging','drag-over'));
  _dragSrcEl = null;
}

/**
 * 更新列上的排序序號顯示
 */
function updateSortBadges(container) {
  let i = 1;
  container.querySelectorAll('tr[data-mid]').forEach(row => {
    const badge = row.querySelector('.sort-badge');
    if (badge) badge.textContent = i;
    i++;
  });
}

/**
 * 上移節點
 */
function moveMsUp(mid) {
  const list = document.querySelector('tbody.ms-list-wrap');
  if (!list) return;
  const rows = [...list.querySelectorAll('tr[data-mid]')];
  const idx  = rows.findIndex(r => r.dataset.mid === mid);
  if (idx <= 0) return;
  list.insertBefore(rows[idx], rows[idx - 1]);
  updateSortBadges(list);
}

/**
 * 下移節點
 */
function moveMsDown(mid) {
  const list = document.querySelector('tbody.ms-list-wrap');
  if (!list) return;
  const rows = [...list.querySelectorAll('tr[data-mid]')];
  const idx  = rows.findIndex(r => r.dataset.mid === mid);
  if (idx < 0 || idx >= rows.length - 1) return;
  list.insertBefore(rows[idx + 1], rows[idx]);
  updateSortBadges(list);
}

/**
 * 儲存排序（送出到 GAS）
 */
async function saveSortOrder() {
  const list = document.querySelector('tbody.ms-list-wrap');
  if (!list || !_sortProjId) return;

  const rows = [...list.querySelectorAll('tr[data-mid]')];
  const orderedIds = rows.map((row, i) => ({
    milestoneId: row.dataset.mid,
    sortOrder:   (i + 1) * 10   // 10, 20, 30... 留間隔方便插入
  }));

  if (orderedIds.length === 0) { exitSortMode(false); return; }

  ld(true);
  try {
    const r = await doPost({
      action:     'reorderMilestones',
      token:      APP.token,
      orderedIds: orderedIds
    });
    if (r.success) {
      toast('success', `排序已儲存（${r.updated} 個節點）`);
      exitSortMode(true);
    } else {
      toast('danger', r.error || '儲存失敗');
    }
  } catch(e) {
    toast('danger', '連線失敗：' + e.message);
  } finally {
    ld(false);
  }
}

function apiErr(r){if(r.error&&r.error.includes('登入'))doLogout();toast('danger',r.error||'發生錯誤');}
</script>
